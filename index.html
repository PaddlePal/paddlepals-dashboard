<!DOCTYPE html>
<html>
<head>
  <title>PaddlePals Dashboard</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    #data { margin-top: 20px; font-size: 14px; white-space: pre-line; border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; }
  </style>
</head>
<body>
  <h2>PaddlePals BLE Dashboard</h2>
  <div id="data">Waiting for data...</div>

  <script>
    const socket = new WebSocket("ws://172.16.181.150:3000");

    socket.onmessage = (event) => {
      const dataDiv = document.getElementById("data");
      dataDiv.innerText = event.data + "\n" + dataDiv.innerText;
    };
  </script>
</body>
</html>
