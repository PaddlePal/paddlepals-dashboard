<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>PaddlePals</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg:       #07070f;
      --surface:  #0e0e1c;
      --border:   #191930;
      --border2:  #222240;
      --accent:   #6ee7f7;
      --purple:   #a78bfa;
      --green:    #34d399;
      --amber:    #fbbf24;
      --pink:     #f472b6;
      --text:     #dde0f0;
      --muted:    #383860;
      --dim:      #111120;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, #1a1a35 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }
    .wrap {
      position: relative; z-index: 1;
      max-width: 480px; margin: 0 auto;
      padding: 0 14px 60px;
    }
    .header {
      padding: 44px 0 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand-name { font-size: 24px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
    .brand-name em { font-style: normal; color: var(--accent); }
    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.12em; margin-top: 3px;
    }
    .pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 20px; padding: 6px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--muted); transition: all 0.4s;
    }
    .pill.on  { color: var(--green);  border-color: rgba(52,211,153,0.25); }
    .pill.err { color: var(--pink);   border-color: rgba(244,114,182,0.25); }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.on .pill-dot { animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .sec-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 8px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 20px; overflow: hidden; position: relative;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 10%, var(--accent) 50%, transparent 90%);
      opacity: 0.2;
    }
    .model-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 0;
    }
    #threeCanvas { display: block; width: 100%; height: 220px; border-radius: 0 0 20px 20px; }
    .imu-readout {
      display: grid; grid-template-columns: repeat(6, 1fr);
      gap: 0; border-top: 1px solid var(--border);
    }
    .imu-cell {
      padding: 8px 4px; display: flex; flex-direction: column;
      align-items: center; gap: 2px; border-right: 1px solid var(--border);
    }
    .imu-cell:last-child { border-right: none; }
    .imu-lbl { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--muted); text-transform: uppercase; }
    .imu-val { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
    .imu-val.a { color: var(--purple); }
    .main-row {
      display: grid; grid-template-columns: 180px 1fr;
      gap: 10px; margin-bottom: 10px; align-items: start;
    }
    .paddle-map-card { padding: 10px 8px; }
    .paddle-svg { width: 100%; }
    .zones-card { padding: 10px; }
    .zones-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto auto auto auto auto;
      gap: 5px;
    }
    .zc[data-z="4"] { grid-column: 2; grid-row: 1; }
    .zc[data-z="3"] { grid-column: 1; grid-row: 2 / span 3; }
    .zc[data-z="1"] { grid-column: 2; grid-row: 2 / span 3; }
    .zc[data-z="2"] { grid-column: 3; grid-row: 2 / span 3; }
    .zc[data-z="5"] { grid-column: 2; grid-row: 5; }
    .zc[data-z="6"] { grid-column: 2; grid-row: 6; }
    .zc {
      background: var(--dim); border: 1px solid var(--border);
      border-radius: 8px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; padding: 6px 4px; min-height: 40px;
      transition: background 0.18s, border-color 0.18s;
      position: relative; overflow: hidden;
    }
    .zc[data-zone="1"] { --zc: var(--purple); }
    .zc[data-zone="2"] { --zc: var(--green);  }
    .zc[data-zone="3"] { --zc: var(--green);  }
    .zc[data-zone="4"] { --zc: var(--accent); }
    .zc[data-zone="5"] { --zc: var(--purple); }
    .zc[data-zone="6"] { --zc: var(--amber);  }
    .zc.active { background: color-mix(in srgb, var(--zc) 12%, var(--dim)); border-color: var(--zc); }
    .zc.flash  { animation: zflash 0.25s ease-out; }
    @keyframes zflash { 0%{transform:scale(1.06)} 100%{transform:scale(1)} }
    .zc-label { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .zc-val   { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; transition: color 0.2s; }
    .zc.active .zc-val   { color: var(--zc); }
    .zc.active .zc-label { color: color-mix(in srgb, var(--zc) 50%, var(--muted)); }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 14px; padding: 14px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .stat-val  { font-size: 24px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-lbl  { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .shot-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; margin-bottom: 10px; }
    .shot-left { display: flex; flex-direction: column; gap: 3px; }
    .shot-type { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; color: var(--accent); transition: color 0.3s; }
    .shot-speed { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); }
    .shot-icon { font-size: 28px; }
    .feed-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .feed-clear { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); background: none; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; padding: 0; }
    .feed-clear:hover { color: var(--accent); }
    .feed { background: #050509; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; height: 90px; overflow-y: auto; scrollbar-width: none; }
    .feed::-webkit-scrollbar { display: none; }
    .feed-item { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-item.h { color: var(--accent); }
    .feed-item.s { color: var(--green); }
    .feed-item.i { color: #1e1e3a; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="brand-name">Paddle<em>Pals</em></div>
      <div class="brand-sub">Live · sensor feed</div>

    <div class="pill" id="pill">

    <div class="model-header">

</div>

<script>
// ═══════════════════════════════════════════════════════════════
// MADGWICK FILTER — runs in JS, uses Arduino micros() for dt
//
// Why Arduino timestamp instead of performance.now() for dt:
//   - BLE can buffer/delay packets arbitrarily (jitter)
//   - If two packets arrive 80ms apart at the browser but were
//     sampled 5ms apart on the sensor, performance.now() dt would
//     make the filter integrate 16x too much rotation → jumps
//   - Arduino micros() reflects the true inter-sample interval
//   - Overflow handled: micros() wraps at 2^32 (~70 min)
// ═══════════════════════════════════════════════════════════════
const Madgwick = (() => {
  // Beta: how aggressively accel corrects gyro drift.
  // 0.033 = original Madgwick paper value at ~100Hz.
  // Raise if orientation feels sluggish; lower if jittery.
  const beta = 0.033;

  let q0 = 1, q1 = 0, q2 = 0, q3 = 0;

  // Last Arduino micros() timestamp — used to compute true dt
  let lastArduinoUs = null;

  // Hz tracking for display
  let _hzCount = 0, _hzLast = performance.now();

  function update(gx, gy, gz, ax, ay, az, arduinoUs) {
    // ── Compute dt from Arduino's own clock ──
    let dt = 0.01; // safe default for very first sample
    if (lastArduinoUs !== null) {
      // Handle micros() overflow (wraps at 2^32 ≈ 71 min)
      let diff = arduinoUs - lastArduinoUs;
      if (diff < 0) diff += 4294967296;
      dt = diff / 1e6;
      // Clamp: ignore stale/corrupt packets
      if (dt <= 0 || dt > 0.5) dt = 0.01;
    }
    lastArduinoUs = arduinoUs;

    // ── Hz display (uses wall clock — just for the counter) ──
    _hzCount++;
    const now = performance.now();
    if (now - _hzLast >= 1000) {
      document.getElementById('gyroHz').textContent = _hzCount + ' Hz';
      _hzCount = 0;
      _hzLast  = now;
    }

    // ── Convert gyro deg/s → rad/s ──
    const D2R = Math.PI / 180;
    gx *= D2R; gy *= D2R; gz *= D2R;

    // ── Rate of change of quaternion from gyroscope ──
    let qDot0 = 0.5 * (-q1*gx - q2*gy - q3*gz);
    let qDot1 = 0.5 * ( q0*gx + q2*gz - q3*gy);
    let qDot2 = 0.5 * ( q0*gy - q1*gz + q3*gx);
    let qDot3 = 0.5 * ( q0*gz + q1*gy - q2*gx);

    // ── Accelerometer correction ──
    // Skip during hard swings (accel >> 1g means linear acceleration
    // is dominating — not a reliable gravity reference)
    const accelMag = Math.sqrt(ax*ax + ay*ay + az*az);
    if (accelMag > 0.5 && accelMag < 8.0) {
      const rn = 1 / accelMag;
      ax *= rn; ay *= rn; az *= rn;

      const _2q0 = 2*q0, _2q1 = 2*q1, _2q2 = 2*q2, _2q3 = 2*q3;
      const _4q0 = 4*q0, _4q1 = 4*q1, _4q2 = 4*q2;
      const _8q1 = 8*q1, _8q2 = 8*q2;
      const q0q0 = q0*q0, q1q1 = q1*q1, q2q2 = q2*q2, q3q3 = q3*q3;

      let s0 = _4q0*q2q2 + _2q2*ax + _4q0*q1q1 - _2q1*ay;
      let s1 = _4q1*q3q3 - _2q3*ax + 4*q0q0*q1 - _2q0*ay - _4q1 + _8q1*q1q1 + _8q1*q2q2 + _4q1*az;
      let s2 = 4*q0q0*q2 + _2q0*ax + _4q2*q3q3 - _2q3*ay - _4q2 + _8q2*q1q1 + _8q2*q2q2 + _4q2*az;
      let s3 = 4*q1q1*q3 - _2q1*ax + 4*q2q2*q3 - _2q2*ay;

      const sn = 1 / Math.sqrt(s0*s0 + s1*s1 + s2*s2 + s3*s3);
      s0 *= sn; s1 *= sn; s2 *= sn; s3 *= sn;

      qDot0 -= beta * s0;
      qDot1 -= beta * s1;
      qDot2 -= beta * s2;
      qDot3 -= beta * s3;
    }

    // ── Integrate using true dt ──
    q0 += qDot0 * dt;
    q1 += qDot1 * dt;
    q2 += qDot2 * dt;
    q3 += qDot3 * dt;

    // ── Normalise ──
    const norm = 1 / Math.sqrt(q0*q0 + q1*q1 + q2*q2 + q3*q3);
    q0 *= norm; q1 *= norm; q2 *= norm; q3 *= norm;
  }

  function getQuaternion() { return { w: q0, x: q1, y: q2, z: q3 }; }

  function getEuler() {
    const pitch = Math.atan2(2*(q0*q1 + q2*q3), 1 - 2*(q1*q1 + q2*q2)) * (180/Math.PI);
    const yaw   = Math.asin(Math.max(-1, Math.min(1, 2*(q0*q2 - q3*q1)))) * (180/Math.PI);
    const roll  = Math.atan2(2*(q0*q3 + q1*q2), 1 - 2*(q2*q2 + q3*q3)) * (180/Math.PI);
    return { pitch, roll, yaw };
  }

  function reset() { q0=1; q1=0; q2=0; q3=0; lastArduinoUs=null; }

  return { update, getQuaternion, getEuler, reset };
})();


// ═══════════════════════════════════════════════
// THREE.JS — 3D PADDLE MODEL
// ═══════════════════════════════════════════════
(function() {
  const canvas = document.getElementById('threeCanvas');
  const W = canvas.parentElement.clientWidth;
  const H = 220;
  canvas.width  = W;
  canvas.height = H;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
  camera.position.set(0, 0.5, 5);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.AmbientLight(0x8888cc, 0.6));
  const kl = new THREE.DirectionalLight(0x6ee7f7, 1.2); kl.position.set(3, 5, 3); scene.add(kl);
  const rl = new THREE.DirectionalLight(0xa78bfa, 0.6); rl.position.set(-3, -2, -3); scene.add(rl);
  const fl = new THREE.PointLight(0x34d399, 0.3, 20);   fl.position.set(0, -3, 2);  scene.add(fl);

  const paddleGroup = new THREE.Group();
  scene.add(paddleGroup);

  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(1, 32, 20),
    new THREE.MeshPhongMaterial({ color: 0x1a1a3a, specular: 0x6ee7f7, shininess: 60, transparent: true, opacity: 0.92 })
  );
  head.scale.set(1.1, 1.35, 0.12); head.position.y = 0.5;
  paddleGroup.add(head);

  // Edge ring
  const edge = new THREE.Mesh(
    new THREE.TorusGeometry(1.0, 0.04, 8, 60),
    new THREE.MeshPhongMaterial({ color: 0x4040a0, specular: 0x8888ff, shininess: 80 })
  );
  edge.scale.set(1.1, 1.35, 1); edge.position.y = 0.5;
  paddleGroup.add(edge);

  // Zone grid lines
  const lm = new THREE.LineBasicMaterial({ color: 0x2a2a5a, transparent: true, opacity: 0.6 });
  [-0.35, 0.35].forEach(x => {
    paddleGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,-0.4,0.07), new THREE.Vector3(x,1.4,0.07)]), lm
    ));
  });
  [-0.2, 0.3, 0.8, 1.3].forEach(y => {
    paddleGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-0.9,y,0.07), new THREE.Vector3(0.9,y,0.07)]), lm
    ));
  });

  // Handle
  const handle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.14, 1.4, 16),
    new THREE.MeshPhongMaterial({ color: 0x0f0f20, specular: 0x333366, shininess: 30 })
  );
  handle.position.y = -0.85; paddleGroup.add(handle);

  // Grip rings
  for (let i = 0; i < 5; i++) {
    const g = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.012, 6, 20), new THREE.MeshPhongMaterial({ color: 0x1a1a35 }));
    g.position.y = -0.5 - i*0.18; g.rotation.x = Math.PI/2;
    paddleGroup.add(g);
  }

  // Hit flash
  const flashMat = new THREE.MeshBasicMaterial({ color: 0x6ee7f7, transparent: true, opacity: 0, side: THREE.DoubleSide });
  const flashPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.8), flashMat);
  flashPlane.position.set(0, 0.5, 0.14); paddleGroup.add(flashPlane);

  let idleRotation = true;
  let idleAngle    = 0;
  const threeQuat  = new THREE.Quaternion();

  window.setOrientationActive = () => { idleRotation = false; };

  window.triggerHitFlash = function() {
    flashMat.opacity = 0.4;
    const start = performance.now();
    (function fade() {
      const t = (performance.now() - start) / 400;
      flashMat.opacity = Math.max(0, 0.4 * (1 - t));
      if (t < 1) requestAnimationFrame(fade);
    })();
  };

  (function animate() {
    requestAnimationFrame(animate);
    if (idleRotation) {
      idleAngle += 0.008;
      paddleGroup.rotation.y = Math.sin(idleAngle) * 0.4;
      paddleGroup.rotation.x = Math.sin(idleAngle * 0.7) * 0.15;
    } else {
      // Pull latest quaternion from Madgwick every frame
      // Three.js (x,y,z,w) ← Madgwick (w,x,y,z)
      const q = Madgwick.getQuaternion();
      threeQuat.set(q.x, q.y, q.z, q.w);
      paddleGroup.quaternion.copy(threeQuat);
    }
    renderer.render(scene, camera);
  })();

  window.addEventListener('resize', () => {
    const W2 = canvas.parentElement.clientWidth;
    camera.aspect = W2 / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W2, H);
  });
})();


// ═══════════════════════════════════════════════
// WEBSOCKET + DATA HANDLING
// ═══════════════════════════════════════════════
const socket  = new WebSocket("ws://172.16.181.150:3000");
const pill    = document.getElementById('pill');
const pillLbl = document.getElementById('pillLabel');

function setPill(cls, label) { pill.className = 'pill ' + cls; pillLbl.textContent = label; }

socket.onopen  = () => { setPill('on', 'Live'); addFeed('WebSocket connected', 's'); };
socket.onerror = () => setPill('err', 'Error');
socket.onclose = () => setPill('err', 'Disconnected');

socket.onmessage = (e) => {
  const raw = e.data.toString().trim();
  if      (raw.startsWith('HIT:')) processHit(raw.slice(4));
  else if (raw.startsWith('IMU:')) processIMU(raw.slice(4));
  else                             processHit(raw);
};

const getF = (str, k) => parseFloat(str.match(new RegExp(k + ':([-\\d.]+)'))?.[1] ?? '0');

// ── IMU stream handler ──
// Format: "T:us,GX:v,GY:v,GZ:v,AX:v,AY:v,AZ:v"
function processIMU(data) {
  const arduinoUs = getF(data, 'T');
  const gx = getF(data, 'GX'), gy = getF(data, 'GY'), gz = getF(data, 'GZ');
  const ax = getF(data, 'AX'), ay = getF(data, 'AY'), az = getF(data, 'AZ');

  // Feed into Madgwick with true Arduino-side dt
  Madgwick.update(gx, gy, gz, ax, ay, az, arduinoUs);
  window.setOrientationActive();

  // Update Euler angle readout
  const e   = Madgwick.getEuler();
  const fmt = v => (v >= 0 ? ' ' : '') + v.toFixed(1) + '°';
  document.getElementById('iGX').textContent = fmt(e.pitch);
  document.getElementById('iGY').textContent = fmt(e.roll);
  document.getElementById('iGZ').textContent = fmt(e.yaw);

  // Accel readout
  const fmtA = v => (v >= 0 ? ' ' : '') + v.toFixed(2);
  document.getElementById('iAX').textContent = fmtA(ax);
  document.getElementById('iAY').textContent = fmtA(ay);
  document.getElementById('iAZ').textContent = fmtA(az);

  if (Math.random() < 0.03) addFeed(data, 'i');
}

// ── Hit handler ──
// Format: "Z3:180,GX:v,GY:v,GZ:v"
let hitCount = 0, peakVal = 0;

function processHit(data) {
  const zm = data.match(/Z(\d+):(\d+)/);
  if (!zm) return;
  const zNum = zm[1], val = parseInt(zm[2]);

  addFeed(data, 'h');
  hitCount++;
  document.getElementById('hitCount').textContent = hitCount;

  window.triggerHitFlash();
  flashChip(zNum, val);
  flashSVG('svg-z' + zNum);

  if (val > peakVal) {
    peakVal = val;
    document.getElementById('peakZone').textContent = 'Z' + zNum;
    document.getElementById('peakVal').textContent  = val;
  }

  const gx = getF(data, 'GX'), gy = getF(data, 'GY'), gz = getF(data, 'GZ');
  classifyShot(zNum, val, gx, gy, gz);
}

function flashChip(key, val) {
  const chip  = document.getElementById('chip-z' + key);
  const valEl = document.getElementById('v' + key);
  if (!chip) return;
  if (valEl) valEl.textContent = val;
  chip.classList.add('active', 'flash');
  setTimeout(() => { chip.classList.remove('active', 'flash'); if (valEl) valEl.textContent = '—'; }, 900);
}

function flashSVG(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.fill   = 'rgba(110,231,247,0.4)';
  el.style.filter = 'brightness(2.5)';
  setTimeout(() => { el.style.fill = ''; el.style.filter = ''; }, 400);
}

const SHOTS = [
  { test: (z,v,gx,gy,gz) => v < 25,               label:'Dink / Drop',    icon:'🫧', color:'var(--green)'  },
  { test: (z,v,gx,gy,gz) => Math.abs(gz) > 120,   label:'Spin Shot',      icon:'🌀', color:'var(--amber)'  },
  { test: (z,v,gx,gy,gz) => gx > 140 && v > 90,   label:'Smash',          icon:'💥', color:'var(--pink)'   },
  { test: (z,v,gx,gy,gz) => gy < -50,              label:'Forehand Drive', icon:'➡️', color:'var(--accent)' },
  { test: (z,v,gx,gy,gz) => gy > 50,               label:'Backhand Drive', icon:'⬅️', color:'var(--purple)' },
  { test: (z,v,gx,gy,gz) => v > 90,                label:'Power Hit',      icon:'⚡', color:'var(--pink)'   },
  { test: () => true,                               label:'Rally Shot',     icon:'🏓', color:'var(--accent)' },
];

function classifyShot(zNum, val, gx, gy, gz) {
  const speed = Math.sqrt(gx*gx + gy*gy + gz*gz);
  const shot  = SHOTS.find(s => s.test(zNum, val, gx, gy, gz));
  document.getElementById('shotType').textContent  = shot.label;
  document.getElementById('shotType').style.color  = shot.color;
  document.getElementById('shotSpeed').textContent = `${Math.round(speed)} °/s · Z${zNum} · peak ${val}`;
  document.getElementById('shotIcon').textContent  = shot.icon;
}

function addFeed(txt, cls) {
  const feed = document.getElementById('feed');
  const el   = document.createElement('div');
  el.className   = 'feed-item ' + cls;
  el.textContent = txt;
  feed.insertBefore(el, feed.firstChild);
  if (feed.children.length > 50) feed.removeChild(feed.lastChild);
}

function clearFeed() { document.getElementById('feed').innerHTML = ''; }
</script>
